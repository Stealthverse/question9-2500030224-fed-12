<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f4" />
    <title>Goods — Thoughtful everyday essentials</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #20231f;
        background: #f7f7f4;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      .page {
        width: min(1120px, calc(100% - 48px));
        margin: 0 auto;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 84px;
        border-bottom: 1px solid #e8e8e2;
      }

      .brand {
        color: inherit;
        font-size: 1.15rem;
        font-weight: 800;
        letter-spacing: -0.07em;
        text-decoration: none;
      }

      .header-note {
        color: #777a72;
        font-size: 0.8rem;
      }

      main {
        padding: 76px 0 96px;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #75816a;
        font-size: 0.72rem;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 6vw, 4.4rem);
        font-weight: 600;
        letter-spacing: -0.075em;
        line-height: 1.02;
      }

      .intro {
        max-width: 420px;
        margin: 18px 0 0;
        color: #777a72;
        font-size: 1rem;
        line-height: 1.65;
      }

      .product-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px;
        margin-top: 48px;
      }

      .product-card {
        min-width: 0;
      }

      .product-art {
        display: grid;
        aspect-ratio: 4 / 4.5;
        place-items: center;
        overflow: hidden;
        border-radius: 12px;
        background: var(--art-bg);
      }

      .product-art span {
        display: grid;
        width: 118px;
        height: 118px;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 55%);
        border-radius: 50%;
        background: rgb(255 255 255 / 35%);
        font-size: 3.5rem;
        box-shadow: 0 18px 50px rgb(34 39 29 / 10%);
        transition: transform 180ms ease;
      }

      .product-card:hover .product-art span {
        transform: translateY(-5px) rotate(-4deg);
      }

      .product-info {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 2px 0;
      }

      .product-name,
      .product-price {
        margin: 0;
        font-size: 0.9rem;
      }

      .product-name {
        font-weight: 600;
      }

      .product-price {
        flex: 0 0 auto;
        color: #777a72;
      }

      @media (max-width: 760px) {
        .product-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 28px 16px;
        }
      }

      @media (max-width: 480px) {
        .page {
          width: min(100% - 32px, 400px);
        }

        .site-header {
          height: 68px;
        }

        main {
          padding-top: 56px;
        }

        .product-info {
          align-items: flex-start;
          flex-direction: column;
          gap: 5px;
          padding-top: 12px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a class="brand" href="#" aria-label="Goods home">goods.</a>
        <span class="header-note">Better things, made to last.</span>
      </header>

      <main>
        <p class="eyebrow">The everyday edit</p>
        <h1>Small things.<br />Made better.</h1>
        <p class="intro">Thoughtful essentials for the moments that make up your day.</p>
        <section class="product-grid" id="products" aria-label="Featured products"></section>
      </main>
    </div>

    <script>
      const products = [
        { name: "Studio headphones", price: 89, icon: "🎧", background: "#e8e4d8" },
        { name: "Everyday timepiece", price: 124, icon: "⌚", background: "#e3e8df" },
        { name: "Pocket camera", price: 199, icon: "📷", background: "#ebe1dc" },
        { name: "Weekend sneakers", price: 96, icon: "👟", background: "#e3e4eb" },
      ];

      function ProductCard({ name, price }) {
        const card = document.createElement("article");
        card.className = "product-card";
        card.innerHTML = `
          <div class="product-art" aria-hidden="true">
            <span></span>
          </div>
          <div class="product-info">
            <h2 class="product-name"></h2>
            <p class="product-price"></p>
          </div>
        `;

        card.querySelector(".product-name").textContent = name;
        card.querySelector(".product-price").textContent = new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
          maximumFractionDigits: 0,
        }).format(price);

        return card;
      }

      const productGrid = document.querySelector("#products");
      products.forEach((product) => {
        const card = ProductCard(product);
        card.querySelector(".product-art").style.setProperty("--art-bg", product.background);
        card.querySelector(".product-art span").textContent = product.icon;
        productGrid.append(card);
      });
    </script>
  </body>
</html>
